version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. MySQL 8.0 Relational Database
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: copilot_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-business_copilot}
      MYSQL_USER: ${MYSQL_USER:-copilot_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-copilot_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Automatically initializes schema, tables, seed data, and read-only user on startup
      - ./data/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword123}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - copilot_net

  # -------------------------------------------------------------
  # 2. FastAPI Multi-Agent Backend Service
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: copilot_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-business_copilot}
      MYSQL_READONLY_USER: ${MYSQL_READONLY_USER:-copilot_readonly}
      MYSQL_READONLY_PASSWORD: ${MYSQL_READONLY_PASSWORD:-readonly_pass}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - faiss_data:/app/data/faiss_index
      - ./data/documents:/app/data/documents:ro
    networks:
      - copilot_net

  # -------------------------------------------------------------
  # 3. Streamlit Interactive Web Interface
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: copilot_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "8501:8501"
    networks:
      - copilot_net

# -------------------------------------------------------------
# Volumes and Networks
# -------------------------------------------------------------
volumes:
  mysql_data:
  faiss_data:

networks:
  copilot_net:
    driver: bridge

